<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OEF-25 CCTV Footage Request</title>
<meta name="description" content="Register and tracker for CCTV footage requests (Form OEF-25 Rev 02), including request management, review workflow, and export capabilities.">
<meta property="og:title" content="OEF-25 CCTV Footage Request">
<meta property="og:description" content="Register and tracker for CCTV footage requests (Form OEF-25 Rev 02), including request management, review workflow, and export capabilities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/workspace.css">
<style>
/* Universal Roboto font application */
*, *::before, *::after {
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  box-sizing: border-box;
}
code, pre, .font-mono, td.m, .hc, .step-num, .section-number, .sec-name span, .page-tag, .stat b, .header-count {
  font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace !important;
}

.card {
  scroll-margin-top: 76px;
}
.section-nav a.active {
  background: var(--accent-dim) !important;
  color: var(--accent) !important;
  font-weight: 600;
}
.section-nav a.active .sec-name span {
  color: var(--accent) !important;
}
.sec-badge {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  display: none;
  font-size: 0;
  line-height: 0;
  overflow: hidden;
}
.sec-badge.complete {
  display: inline-block !important;
  background: var(--success);
  box-shadow: 0 0 4px rgba(0, 210, 106, 0.5);
}

/* Print / PDF layout matching sals-sir-online reference */
#printArea { display: none; }
@media print {
  header, .sidebar, main, .modal-overlay, #toast, .no-print { display: none !important; }
  body { background: white !important; }
  #printArea { display: block !important; position: static !important; width: 100%; }
  .pf tr { break-inside: avoid; }
  .pf-wrap {
    box-shadow: none !important;
    border: none !important;
    margin: 0 auto !important;
    max-width: 660px !important;
  }
  .pf-watermark {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    pointer-events: none !important;
    overflow: hidden !important;
    z-index: 5 !important;
  }
  .pf-watermark span {
    transform: rotate(-40deg) !important;
    font-size: 50px !important;
    font-weight: bold !important;
    color: rgba(115, 115, 115, 0.22) !important;
    letter-spacing: 0 !important;
    white-space: nowrap !important;
    font-family: Helvetica, Arial, sans-serif !important;
    user-select: none !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  @page { size: A4; margin: 12mm; }
}

.pf-wrap {
  position: relative;
  background: #fff;
  color: #1f2630;
  font-family: Helvetica, Arial, sans-serif;
  max-width: 660px;
  width: 100%;
  margin: 12px auto;
  padding: 26px 28px 20px;
  box-sizing: border-box;
  box-shadow: 0 4px 24px rgba(0,0,0,.22);
  border: 1px solid #b8bfc7;
  border-radius: 2px;
}
.pf-watermark {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  overflow: hidden;
  z-index: 5;
}
.pf-watermark span {
  transform: rotate(-40deg);
  font-size: 50px;
  font-weight: bold;
  color: rgba(115, 115, 115, 0.22);
  letter-spacing: 0;
  white-space: nowrap;
  font-family: Helvetica, Arial, sans-serif !important;
  user-select: none;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.pf-doc-header {
  margin-bottom: 8px;
  font-family: Helvetica, Arial, sans-serif;
  color: #1f2630;
}
.pf-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.pf-logo {
  height: 25px;
  width: auto;
  object-fit: contain;
  display: block;
}
.pf-form-code {
  font-size: 11px;
  font-weight: 700;
  color: #1f2630;
  font-family: Helvetica, Arial, sans-serif !important;
}
.pf-header-sub {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.pf-doc-title {
  font-size: 15px;
  font-weight: 700;
  color: #1f2630;
  font-family: Helvetica, Arial, sans-serif !important;
}
.pf-doc-meta {
  font-size: 10px;
  font-weight: 700;
  color: #4a525d;
  font-family: Helvetica, Arial, sans-serif !important;
}
.pf {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  color: #000;
  background: #fff;
  font-family: Helvetica, Arial, sans-serif;
}
.pf td, .pf th {
  border: 1px solid #262626;
  padding: 4.5px 6px;
  color: #000;
  background: #fff;
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
  font-family: Helvetica, Arial, sans-serif;
  vertical-align: top;
}
.pf th {
  background: #d9d9d9 !important;
  text-align: left;
  font-weight: 700;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}
.pf .t {
  text-align: center;
  font-size: 14.5px;
  font-weight: 700;
}
.pf .k {
  background: #f2f2f2 !important;
  font-weight: 700;
  width: 19%;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* Supplementary Kinetic Brutalist layout adjustments */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  border-top: 2px solid var(--accent);
}
.stat b {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.stat span {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px 14px;
}
.grid .w2 { grid-column: span 2; }
.grid .full { grid-column: 1 / -1; }
.checks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 6px;
}
.checks label {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: var(--bg);
  font-size: 12px;
  transition: all var(--transition-fast);
}
.checks label:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
}
.checks input { accent-color: var(--accent); }
.decl {
  font-size: 12px;
  color: var(--text-muted);
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  margin: 0 0 12px;
  background: var(--accent-dim);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.field.bad input, .field.bad select, .field.bad textarea {
  border-color: var(--danger) !important;
}
.field em {
  display: none;
  color: var(--danger);
  font-size: 10px;
  font-style: normal;
  margin-top: 2px;
}
.field.bad em { display: block; }
.preview-modal-box {
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 820px;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  padding: 20px;
}
.preview-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.preview-close-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
}
.preview-close-btn:hover {
  background: var(--card-hover);
  color: var(--text);
}
.grow { flex-grow: 1; }
.status-rejected {
  border-color: var(--danger) !important;
  background: rgba(255, 59, 59, .12) !important;
}
.status-rejected .step-num {
  background: var(--danger) !important;
  color: #fff !important;
}
.status-pill.status-rejected {
  background: rgba(255, 59, 59, 0.15);
  color: #ff5c5c;
  border-color: rgba(255, 59, 59, 0.3);
}

/* Compact Tracker Table matching sals-sir-online reference */
#registerTable {
  width: 100%;
  min-width: 780px;
  font-family: var(--font-sans);
  font-size: 11px;
  border-collapse: collapse;
  table-layout: auto;
}
#registerTable th {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
#registerTable td {
  font-family: var(--font-sans);
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  vertical-align: middle;
  color: var(--text);
  line-height: 1.35;
  font-size: 11px;
}
[data-theme="light"] #registerTable td {
  border-bottom: 1px solid var(--border);
}
#registerTable tr:last-child td {
  border-bottom: 0;
}
#registerTable tbody tr {
  transition: background var(--transition-fast);
}
#registerTable tbody tr:hover {
  background: var(--card-hover);
}
#registerTable td:first-child {
  font-family: var(--font-mono) !important;
  font-size: 11px;
  font-weight: 500;
  min-width: 82px;
  width: 90px;
  white-space: nowrap;
  color: var(--text-muted);
}
#registerTable td:nth-child(2) {
  min-width: 110px;
  max-width: 170px;
}
#registerTable td:nth-child(3) {
  min-width: 95px;
  max-width: 135px;
  white-space: nowrap;
}
#registerTable td:nth-child(4) {
  min-width: 120px;
  max-width: 160px;
  white-space: nowrap;
}
#registerTable td:nth-child(5) {
  min-width: 110px;
  max-width: 150px;
  white-space: nowrap;
}
#registerTable td:nth-child(6) {
  min-width: 85px;
  width: 95px;
  white-space: nowrap;
}
#registerTable th:last-child {
  text-align: right;
}
#registerTable td:last-child {
  min-width: 135px;
  width: auto;
  text-align: right;
  white-space: nowrap;
}
#registerTable .compact-text {
  font-family: var(--font-sans);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  color: var(--text);
  font-size: 11px;
}
#registerTable .small-muted {
  font-family: var(--font-sans) !important;
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#registerTable .compact-cell-btn {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  max-width: 135px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  line-height: 1.25;
  transition: all var(--transition-fast);
  text-decoration: none;
  vertical-align: middle;
}
#registerTable .compact-cell-btn:hover {
  background: var(--accent-dim);
  border-color: rgba(255, 77, 0, 0.3);
  color: var(--accent);
}
#registerTable .cell-btn-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-block;
  font-family: var(--font-sans);
}
#registerTable .cell-btn-icon {
  font-size: 8px;
  color: var(--text-muted);
  flex-shrink: 0;
  margin-left: 2px;
}
#registerTable .cell-empty {
  color: var(--text-subtle);
  font-size: 11px;
  font-family: var(--font-sans);
}
#registerTable .status-pill {
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 600;
}
#registerTable .report-actions {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  justify-content: flex-end;
}
#registerTable .report-actions .btn {
  font-family: var(--font-sans);
  padding: 2px 6px;
  font-size: 9px;
  line-height: 1.2;
  min-height: 20px;
  height: 20px;
  white-space: nowrap;
  border-radius: 3px;
  font-weight: 500;
}
#registerTable .report-actions .btn:first-child {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #111;
  color: #fff;
  border: 1px solid var(--accent);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: var(--shadow-lg);
  z-index: 10000;
  display: none;
}

.incident-type-dialog {
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  max-width: 480px;
  width: calc(100% - 32px);
  box-shadow: var(--shadow-lg);
  margin: auto;
}
.incident-type-dialog .eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.incident-type-dialog h3 {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.incident-type-text {
  font-family: var(--font-sans);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 360px;
  overflow-y: auto;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
